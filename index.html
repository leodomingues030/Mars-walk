<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarsWalk - Cratera Gale</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#1a0f0a;color:white}
header{background:#ff6b1a;padding:15px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;font-size:13px}
#map{height:60vh;width:100%;background:#c1440e}
#info{background:#2a1a12;padding:15px;margin:10px;border-radius:10px}
#info h2{margin:0 0 10px;color:#ff8c42;font-size:18px}
.botoes{display:flex;gap:8px;flex-wrap:wrap;margin:10px}
button{background:#ff6b1a;color:white;border:none;padding:10px 15px;border-radius:20px;font-weight:bold;cursor:pointer;flex:1}
button:hover{background:#ff8c42}
.score{font-size:28px;font-weight:bold;color:#4ade80}
</style>
</head>
<body>
<header>
<h1>🚀 MarsWalk - Cratera Gale</h1>
<p>Mapa interativo de sobrevivência em Marte | NASA Space Apps</p>
</header>
<div class="botoes">
<button onclick="irPara(-4.5895,137.4417,8)">📍 Base</button>
<button onclick="irPara(-5.4,137.8,8)">⚠️ Perigo</button>
<button onclick="irPara(-4.7,137.2,8)">🔬 Ciência</button>
<button onclick="irPara(-4.5895,137.4417,7)">🗺️ Rota</button>
</div>
<div id="map"></div>
<div id="info">
<h2>👋 Clique em qualquer lugar do mapa!</h2>
<p id="detalhes">Escolha um local para ver altitude, temperatura, radiação e pontuação de segurança.</p>
</div>
<script>
var map = L.map('map').setView([-4.5895, 137.4417], 7);
L.tileLayer('https://trek.nasa.gov/tiles/Mars/EQ/Mars_Viking_MDIM21_ClrMosaic_global_1024.jpg/1.0.0/default/default028mm/{z}/{y}/{x}.jpg', {maxZoom: 10, minZoom: 3, tms: true, attribution: 'NASA Mars Trek'}).addTo(map);

var base = L.marker([-4.5895, 137.4417]).addTo(map).bindPopup("<b>🏠 Base - Cratera Gale</b><br>Local de pouso seguro");
var perigo = L.circle([-5.4, 137.8], {color:'red', fillColor:'#f03', fillOpacity:0.4, radius: 15000}).addTo(map).bindPopup("<b>⚠️ Zona de Perigo - Monte Sharp</b><br>Alta radiação e declive perigoso");
var ciencia = L.marker([-4.7, 137.2]).addTo(map).bindPopup("<b>🔬 Formações em Caixa</b><br>Alto valor científico - possíveis sinais de água antiga");
var rota = L.polyline([[-4.5895,137.4417],[-4.7,137.2],[-4.8,137.5],[-5.0,137.6]], {color:'lime', weight:4}).addTo(map).bindPopup("Rota segura");

function irPara(lat,lng,zoom){ map.setView([lat,lng], zoom); }
map.on('click', function(e){
  var lat = e.latlng.lat.toFixed(4);
  var lng = e.latlng.lng.toFixed(4);
  var alt = Math.floor(Math.random()*800 - 4500);
  var temp = Math.floor(Math.random()*20 - 70);
  var rad = (Math.random()*0.5 + 0.1).toFixed(2);
  var score = Math.floor(Math.random()*40 + 55);
  var status = score >= 80 ? '✅ SEGURO' : score >= 60 ? '⚠️ CUIDADO' : '🚨 PERIGOSO';
  var cor = score >= 80 ? '#4ade80' : score >= 60 ? '#facc15' : '#ef4444';
  document.getElementById('detalhes').innerHTML = '<b>📍 Lat:</b> '+lat+' | <b>Lng:</b> '+lng+'<br><b>⛰️ Altitude:</b> '+alt+' m<br><b>🌡️ Temperatura:</b> '+temp+'°C<br><b>☢️ Radiação:</b> '+rad+' mSv/dia<br><br><span class="score" style="color:'+cor+'">Pontuação: '+score+'/100 - '+status+'</span>';
});
</script>
</body>
</html>
